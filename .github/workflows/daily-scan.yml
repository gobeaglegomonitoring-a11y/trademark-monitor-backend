name: Trademark Scan

on:
  schedule:
    # Starts the scan 4 hours BEFORE each report is due (see send-report.yml),
    # giving it a head start so it has finished (even the slow US-states
    # step) by the time the report actually needs to go out. Offset 7 minutes
    # past the hour -- GitHub's docs call out :00 as the most congested
    # minute for scheduled workflows.
    - cron: '7 23,5,11 * * *'  # ~7 PM, 1 AM, and 7 AM EDT (UTC-4) -- 4h before 11 PM / 5 AM / 11 AM
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

jobs:
  run-scan:
    name: Run All Scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger scan on Render backend
        run: |
          echo "Starting daily scan at $(date -u)"
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-scan-api-key: ${{ secrets.SCAN_API_KEY }}" \
            --max-time 60 \
            https://trademark-monitor-backend.onrender.com/api/scan/runall)

          echo "HTTP status: $response"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$response" != "200" ] && [ "$response" != "202" ]; then
            echo "Scan failed with HTTP $response"
            exit 1
          fi

          echo "Scan triggered successfully -- it now runs on Render independently of this workflow."
