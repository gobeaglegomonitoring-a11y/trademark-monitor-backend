name: Trademark Scan

on:
  schedule:
    - cron: '0 4,10,16 * * *'  # three times daily: 12 AM, 6 AM, and 12 PM EDT (UTC-4)
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

jobs:
  run-scan:
    name: Run All Scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Trigger scan on Render backend
        run: |
          echo "Starting daily scan at $(date -u)"
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-scan-api-key: ${{ secrets.SCAN_API_KEY }}" \
            --max-time 1500 \
            https://trade-mark-sys.onrender.com/api/scan/runall)

          echo "HTTP status: $response"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$response" != "200" ] && [ "$response" != "202" ]; then
            echo "Scan failed with HTTP $response"
            exit 1
          fi

          echo "Daily scan completed successfully"

      - name: Keep Render awake and wait for report completion
        env:
          SCAN_API_KEY: ${{ secrets.SCAN_API_KEY }}
        run: |
          for attempt in $(seq 1 30); do
            sleep 240
            body=$(curl -fsS \
              -H "x-scan-api-key: $SCAN_API_KEY" \
              https://trade-mark-sys.onrender.com/api/scan/status)
            echo "Scan status: $body"
            running=$(echo "$body" | jq -r '.running')
            if [ "$running" = "false" ]; then
              echo "All scanners and PDF/email reporting completed"
              exit 0
            fi
          done
          echo "Scan did not complete within the 120-minute monitoring window"
          exit 1
