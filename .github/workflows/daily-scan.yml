name: Trademark Scan

"on":
  # Scheduling is handled by cron-job.org now (same target: /api/scan/runall).
  # A GitHub-side schedule here fires within minutes of cron-job.org's and
  # gets rejected with 409 (a scan is already running) -- pure noise, shows
  # up as a failed run every time. Kept as workflow_dispatch only, for a
  # manual/backup trigger from the Actions tab.
  workflow_dispatch:

jobs:
  run-scan:
    name: Run All Scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger scan on Render backend
        run: |
          echo "Starting daily scan at $(date -u)"
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-scan-api-key: ${{ secrets.SCAN_API_KEY }}" \
            --max-time 60 \
            https://trademark-monitor-backend.onrender.com/api/scan/runall)

          echo "HTTP status: $response"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$response" != "200" ] && [ "$response" != "202" ]; then
            echo "Scan failed with HTTP $response"
            exit 1
          fi

          echo "Scan triggered successfully -- it now runs on Render independently of this workflow."
