name: Send Scheduled Report

"on":
  # Scheduling is handled by cron-job.org now (same target:
  # /api/scan/send-report). Unlike /api/scan/runall, this endpoint has no
  # "already sending" lock, so a GitHub-side schedule firing alongside
  # cron-job.org's would send the client a duplicate report email every
  # time. Kept as workflow_dispatch only, for a manual/backup trigger.
  workflow_dispatch:

jobs:
  send-report:
    name: Email Current Report
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger report email on Render backend
        run: |
          echo "Sending report at $(date -u)"
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-scan-api-key: ${{ secrets.SCAN_API_KEY }}" \
            --max-time 60 \
            https://trademark-monitor-backend.onrender.com/api/scan/send-report)

          echo "HTTP status: $response"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$response" != "200" ] && [ "$response" != "202" ]; then
            echo "Report send failed with HTTP $response"
            exit 1
          fi

          echo "Report send triggered successfully."
